#!/usr/sbin/nft -f
# Replace only our table. Never flush Tailscale's rules.
add table inet external_filter
flush table inet external_filter
table inet external_filter {
    chain input {
        type filter hook input priority 10; policy drop;
        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept
        meta l4proto { icmp, ipv6-icmp } accept
        iifname "eth0" udp sport 67 udp dport 68 accept
        iifname "eth0" udp sport 547 udp dport 546 accept
        iifname "tailscale0" tcp dport 22 accept
        tcp dport { 80, 443, 7000 } accept
        # Direct Tailscale paths if the upstream firewall permits them; DERP also works.
        udp dport 41641 accept
        limit rate 5/minute burst 10 packets log prefix "external-input-drop: "
        counter drop
    }
    chain forward {
        type filter hook forward priority 10; policy drop;
    }
    chain output {
        type filter hook output priority 10; policy accept;
    }
}
